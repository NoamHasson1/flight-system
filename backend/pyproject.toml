[project]
name = "flight-system-backend"
version = "0.1.0"
description = "Flight delay compensation eligibility engine (EC261 / UK261 / Israeli Aviation Services Law)"
requires-python = ">=3.12"

# Deliberately empty. The compensation rules in Phase A are pure standard
# library: math for distance, decimal for money, datetime for delays.
# Every dependency gets added in the step that first needs it, so the
# reason for each one stays visible in the git history.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Providers are async because their work is waiting on someone else's HTTP.
    # asyncio_mode = "auto" below means tests need no decorator.
    "pytest-asyncio>=0.24",
]

[tool.uv]
# This is an application, not a library we publish, so there is no build
# backend and nothing to install. Tests import `app` via pythonpath below.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
