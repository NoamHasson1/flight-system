[project]
name = "flight-system-backend"
version = "0.1.0"
description = "Flight delay compensation eligibility engine (EC261 / UK261 / Israeli Aviation Services Law)"
requires-python = ">=3.12"

# Added in the step that first needs them, so the reason for each one stays
# visible in the git history.
dependencies = [
    # step 11: the AeroDataBox adapter. httpx because it speaks async and
    # ships a MockTransport, which lets the client be tested end to end --
    # status codes, retries, parsing -- without a network or a mocking library.
    "httpx>=0.27",
    # step 13: persistence. SQLAlchemy 2.0 for its typed ORM, and because it
    # makes the eventual move from SQLite to PostgreSQL a connection string
    # rather than a rewrite.
    "SQLAlchemy>=2.0",
    # step 14: versioned schema migrations. create_all() can build a schema
    # from nothing but cannot alter one that already holds rows, which is the
    # only situation that matters after the first deploy.
    "alembic>=1.13",
    # step 16: the HTTP layer. FastAPI for typed request/response models and
    # the OpenAPI document it generates from them; pydantic-settings so
    # configuration is validated at startup rather than discovered at request
    # time; uvicorn to actually serve it.
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    # step 17: EmailStr. Validating an address at the edge is worth it because
    # the confirmation email is how a customer ever hears from us again.
    "email-validator>=2.2",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Providers are async because their work is waiting on someone else's HTTP.
    # asyncio_mode = "auto" below means tests need no decorator.
    "pytest-asyncio>=0.24",
]

[tool.uv]
# This is an application, not a library we publish, so there is no build
# backend and nothing to install. Tests import `app` via pythonpath below.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
