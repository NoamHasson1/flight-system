# Everything this system runs, declared rather than clicked.
#
#   Render → New → Blueprint → pick this repository
#
# ON PAID PLANS as of 23 September 2026. What that bought, and why:
#
#   THE DATABASE IS NO LONGER DELETED AFTER 30 DAYS. That was Render's free
#   tier, not a setting, and it is the only reason the archive lived on a
#   laptop. It can now live here.
#
#   THE ARCHIVE RUNS ON A MACHINE THAT DOES NOT SLEEP. The cron jobs below are
#   the whole point of paying. A laptop running this lost 24.9 hours of three
#   days -- 36% -- to the lid being shut, and the Ben Gurion board sheds the
#   past continuously, so a missed hour is a missed hour forever. Nobody sells
#   2023 back.
#
#   THE WEB SERVICES NO LONGER SLEEP, so there is no cold start for a visitor
#   to outrun. That is a nicety; the archive is not.
#
# THESE PLAN LINES ARE NOT DECORATION. This blueprint is authoritative for a
# blueprint-managed service: leaving `plan: free` here while the dashboard says
# otherwise means the next sync can DOWNGRADE what you are paying for, and take
# the database with it. If you change a plan in the dashboard, change it here
# in the same sitting.
#
# Two secrets are deliberately NOT here -- ENCRYPTION_KEYS and
# AERODATABOX_API_KEY are marked `sync: false`, so Render asks for them once
# and stores them itself. A secret committed to a repository is a secret in
# every clone of it, forever, and this repository is public.

databases:
  - name: flight-db
    databaseName: flight_system
    user: flight
    # $6/month, 0.1 CPU, 256MB. Paid, so it is not deleted after 30 days --
    # which is what makes it somewhere the archive may actually live.
    plan: basic-256mb

services:
  # --- the archive ---------------------------------------------------------
  #
  # The only part of this system where being down DESTROYS something. The
  # website being offline costs a visitor, who comes back. The archive being
  # offline costs a day of Ben Gurion that nobody sells back.
  #
  # Every fifteen minutes, not nightly. The board is not a fixed window over a
  # set of days -- it SHEDS THE PAST CONTINUOUSLY: 189 flights recorded for one
  # day at 09:00, 145 of them still listed four hours later. IZ1168 on 18
  # September was cancelled and paid ILS1,530; it was on the board on the 17th
  # and gone by the 19th, so a nightly job would never have seen it.
  #
  # Running often is free -- no key, no quota, one request -- and an unchanged
  # row is skipped rather than rewritten.
  #
  # No ENCRYPTION_KEYS here, deliberately. This job writes flight_lookups and
  # nothing else; there is no personal data in a flight board. A secret that is
  # not needed should not be pasted into one more place, and if some future
  # task does touch an encrypted column it fails loudly rather than writing
  # plaintext.
  - type: cron
    name: flight-archive
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "*/15 * * * *"
    dockerCommand: python -m app.tasks.archive_board
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-db
          property: connectionString

  # Once a day, buying the far end of disrupted flights while the paid feed
  # still sells it. The board knows only what happened AT Ben Gurion, so a
  # departure has no arrival time -- and EC261 measures the delay at arrival.
  # AeroDataBox keeps about five months on this plan; a passenger has four
  # years. So the far end is bought while it is still for sale.
  - type: cron
    name: flight-enrich
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    schedule: "30 3 * * *"
    dockerCommand: python -m app.tasks.enrich --min-delay 1
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-db
          property: connectionString
      - key: FLIGHT_PROVIDER
        value: aerodatabox
      - key: AERODATABOX_API_KEY
        sync: false
  #     - key: FLIGHT_PROVIDER
  #       value: aerodatabox
  #     - key: AERODATABOX_API_KEY
  #       sync: false


  # --- the application -----------------------------------------------------

  - type: web
    name: flight-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    # Restored now that the plan supports it. It had to be applied by hand on
    # free, which is a step that gets forgotten exactly once and then serves a
    # 500 to whoever is looking.
    #
    # A pre-deploy command, NOT a migration on startup. Migrating as the
    # container boots is the easy way out and the wrong habit: it runs several
    # at once the moment there is more than one instance, and a half-applied
    # schema is worse than a late deploy.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flight-db
          property: connectionString
      # staging, not production, while this is free: production refuses to
      # start without an encryption key, which is right for a real deployment
      # and wrong for a demonstration somebody is trying to show a friend.
      # It also keeps the request trace on, which is what makes a demo
      # debuggable.
      - key: ENVIRONMENT
        value: staging
      - key: ENCRYPTION_KEYS
        sync: false
      - key: AERODATABOX_API_KEY
        sync: false
      - key: FLIGHT_PROVIDER
        value: iaa+aerodatabox
      - key: OPS_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        fromService:
          name: flight-frontend
          type: web
          property: host
      # The admin API lists every customer's name and email, so it stays shut
      # until somebody deliberately sets a key.
      - key: ADMIN_API_KEY
        sync: false

  - type: web
    name: flight-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    envVars:
      # Read when a request arrives, not baked into the image, so the same
      # build runs in staging and production.
      #
      # `host`, not `hostport`. Two reasons, and either one alone breaks it:
      #
      #   hostport renders as "name:10000" with no scheme, which is not a URL
      #   fetch will accept, so every call fails before leaving the container.
      #
      #   And free services have no private network -- they are reachable only
      #   at their public address, on 443. An internal host:port would be the
      #   right answer on a paid plan and is not available here.
      #
      # The scheme is added by the proxy, which treats a bare hostname as
      # https. See src/app/api/[...path]/route.ts.
      - key: BACKEND_ORIGIN
        fromService:
          name: flight-backend
          type: web
          property: host
